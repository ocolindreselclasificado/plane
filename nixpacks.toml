[phases.setup]
nixPkgs = ['nodejs', 'yarn', 'python311', 'postgresql']  # 👈 use python311

[phases.build]
cmds = [
  'python -m ensurepip --upgrade',  # 👈 ensure pip is present
  'pip install --upgrade pip',
  'pip install -r requirements.txt',
  'yarn cache clean',
  'yarn install --immutable --immutable-cache',
  'yarn turbo run build --filter=web',
  'python manage.py migrate'
]

[start]
cmd = 'yarn workspace web start'
