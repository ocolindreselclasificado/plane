[phases.setup]
nixPkgs = ['nodejs', 'yarn', 'python311', 'postgresql']

[phases.build]
cmds = [
  'python3 -m pip install --user -r requirements.txt',  # Use python3 -m pip instead of pip directly
  'yarn cache clean',
  'yarn install --immutable --immutable-cache',
  'yarn turbo run build --filter=web',
  'python3 manage.py migrate'  # Use python3 instead of plain python
]

[start]
cmd = 'yarn workspace web start'
