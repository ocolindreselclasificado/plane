[phases.setup]
nixPkgs = ['nodejs', 'yarn', 'ruby']

[phases.build]
cmds = [
  'cd apiserver && gem install bundler && bundle install',  # Rails setup
  'yarn install --immutable --immutable-cache',              # Next.js frontend
  'yarn turbo run build --filter=web',                       # Build Next.js web
  'cd apiserver && bundle exec rails db:migrate'            # Run Rails migrations
]

[start]
cmd = 'yarn workspace web start'
