[phases.setup]
nixPkgs = ['nodejs', 'yarn', 'python311', 'postgresql']

[phases.build]
cmds = [
  'pip install --user -r requirements.txt',  # Install Python dependencies without touching system Python
  'yarn cache clean',                        # Clear corrupted Yarn cache
  'yarn install --immutable --immutable-cache',  # Install frontend dependencies
  'yarn turbo run build --filter=web',       # Build Next.js frontend
  'python manage.py migrate'                 # Django migrations
]

[start]
cmd = 'yarn workspace web start'
