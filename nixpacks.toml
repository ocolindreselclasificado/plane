[phases.setup]
nixPkgs = ['nodejs', 'yarn', 'ruby']

[phases.build]
cmds = [
  'cd apiserver && gem install bundler && bundle install',  # 👈 Rails setup!
  'yarn install --immutable --immutable-cache',
  'yarn turbo run build --filter=web',
  'cd apiserver && bundle exec rails db:migrate'  # 👈 run migrations in correct dir
]

[start]
cmd = 'yarn workspace web start'
